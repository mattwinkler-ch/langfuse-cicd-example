name: Evaluate Langfuse prompt

on:
  repository_dispatch:
    types: [langfuse-prompt-update]
  workflow_dispatch:
    inputs:
      candidate_version:
        description: Langfuse ticket-router prompt version to test
        required: true
        type: number

permissions:
  contents: read

jobs:
  evaluate:
    if: github.event_name == 'workflow_dispatch' || (github.event.client_payload.prompt.name == 'ticket-router' && github.event.client_payload.action == 'created')
    runs-on: ubuntu-latest
    env:
      CANDIDATE_VERSION: ${{ github.event.client_payload.prompt.version || inputs.candidate_version }}
      LANGFUSE_PUBLIC_KEY: ${{ secrets.LANGFUSE_PUBLIC_KEY }}
      LANGFUSE_SECRET_KEY: ${{ secrets.LANGFUSE_SECRET_KEY }}
      LANGFUSE_BASE_URL: ${{ vars.LANGFUSE_BASE_URL || 'https://cloud.langfuse.com' }}
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
    steps:
      - name: Check experiment configuration
        shell: bash
        run: |
          missing=0
          for name in LANGFUSE_PUBLIC_KEY LANGFUSE_SECRET_KEY OPENAI_API_KEY; do
            if [[ -z "${!name}" ]]; then
              echo "::error title=Missing Actions secret::$name is empty. Add it under Settings → Secrets and variables → Actions → Secrets for this repository."
              missing=1
            fi
          done
          if [[ -z "$CANDIDATE_VERSION" ]]; then
            echo "::error title=Missing prompt version::The dispatch payload or manual input must provide a candidate prompt version."
            missing=1
          fi
          exit "$missing"
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - name: Compare candidate with production
        run: npm run evaluate
